spring:
  application:
    name: cross-border-wallet
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${SPRING_DATASOURCE_USERNAME:wallet}
    password: ${SPRING_DATASOURCE_PASSWORD:wallet}
  flyway:
    enabled: true
    default-schema: public
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-before-deployment-2026}
    access-token-ttl: PT10M
    refresh-token-ttl: P30D

auth:
  rate-limit:
    capacity: 10
    refill-period: PT1M

fx:
  provider: mock
  mock:
    xaf-per-ngn: 0.42
    spread-basis-points: 150
    flat-fee-ngn: 100.00
    flat-fee-xaf: 250

risk:
  single-transfer-threshold:
    NGN: 500000.00
    XAF: 1000000
  kyc-unverified-limit:
    NGN: 100000.00
    XAF: 250000
  daily-outgoing-limit:
    NGN: 2000000.00
    XAF: 5000000
  velocity:
    max-transfers: 5
    window: PT10M

funding:
  gateway: ${FUNDING_GATEWAY:fake}
  webhook-secret: ${FUNDING_WEBHOOK_SECRET:local-funding-webhook-secret}
  paystack:
    secret-key: ${PAYSTACK_SECRET_KEY:}
    base-url: ${PAYSTACK_BASE_URL:https://api.paystack.co}