spring:
  application:
    name: cross-border-wallet
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
    default-schema: public
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: PT10M
    refresh-token-ttl: P30D

auth:
  rate-limit:
    capacity: 10
    refill-period: PT1M

fx:
  provider: mock
  mock:
    xaf-per-ngn: 0.42
    spread-basis-points: 150
    flat-fee-ngn: 100.00
    flat-fee-xaf: 250

risk:
  single-transfer-threshold:
    NGN: 500000.00
    XAF: 1000000
  kyc-unverified-limit:
    NGN: 100000.00
    XAF: 250000
  daily-outgoing-limit:
    NGN: 2000000.00
    XAF: 5000000
  velocity:
    max-transfers: 5
    window: PT10M

funding:
  gateway: ${FUNDING_GATEWAY}
  webhook-secret: ${FUNDING_WEBHOOK_SECRET:${PAYSTACK_SECRET_KEY}}
  paystack:
    secret-key: ${PAYSTACK_SECRET_KEY:}
    base-url: ${PAYSTACK_BASE_URL:https://api.paystack.co}
